<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; width: 300px;
    background: Canvas; color: CanvasText;
  }
  header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
  }
  h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .2px; }
  .origin {
    font-size: 11px; opacity: .65;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status { display: flex; gap: 6px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    padding: 2px 9px; border-radius: 99px; border: 1px solid transparent;
  }
  .pill.protected {
    background: color-mix(in srgb, #2fa36b 18%, transparent);
    border-color: color-mix(in srgb, #2fa36b 45%, transparent);
    color: light-dark(#1d7a4c, #5ecf98);
  }
  .pill.paused {
    background: color-mix(in srgb, #d98b2b 18%, transparent);
    border-color: color-mix(in srgb, #d98b2b 45%, transparent);
    color: light-dark(#9c5e0e, #eec27f);
  }
  .pill.lockdown {
    background: color-mix(in srgb, #2b5fd9 16%, transparent);
    border-color: color-mix(in srgb, #2b5fd9 45%, transparent);
    color: light-dark(#2b5fd9, #8fb0ff);
  }
  .pill.neutral {
    background: color-mix(in srgb, CanvasText 9%, transparent);
    border-color: color-mix(in srgb, CanvasText 20%, transparent);
    opacity: .85;
  }
  section { padding: 11px 14px; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 3px 0;
  }
  .row .n { font-variant-numeric: tabular-nums; opacity: .8; }
  .empty { opacity: .55; font-style: italic; padding: 3px 0; }
  .sep { border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
  button {
    width: 100%; padding: 8px 10px; font: inherit; cursor: pointer;
    border-radius: 6px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    background: color-mix(in srgb, CanvasText 6%, transparent); color: inherit;
  }
  button:hover { background: color-mix(in srgb, CanvasText 12%, transparent); }
  button:focus-visible, a:focus-visible { outline: 2px solid #2b5fd9; outline-offset: 1px; }
  #allow:not(.on):not(:disabled) { border-color: color-mix(in srgb, #2b5fd9 55%, transparent); }
  button.on { border-color: #d98b2b; background: color-mix(in srgb, #d98b2b 18%, transparent); }
  .foot { padding: 0 14px 12px; }
  a { color: light-dark(#2b5fd9, #8fb0ff); font-size: 11px; opacity: .85; }
  #policy-status, #action-error, .note { font-size: 11px; overflow-wrap: anywhere; }
  #action-error { color: #d34242; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
       color: light-dark(#2b5fd9, #8fb0ff); opacity: .9; margin: 0 0 6px; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>Fingerprint Damper</h1>
    <div class="origin" id="origin">-</div>
    <div class="status">
      <span id="status-pill" class="pill neutral">Loading…</span>
      <span id="lockdown-pill" class="pill lockdown" hidden></span>
    </div>
  </header>

  <section>
    <h2>Page API activity (not network blocks)</h2>
    <div id="counts"></div>
  </section>

  <section class="sep">
    <button id="allow">Loading…</button>
  </section>

  <section class="sep">
    <h2>Global lockdown</h2>
    <p id="policy-status" role="status" aria-live="polite">Checking browser rules…</p>
    <button id="lock-off" type="button">Turn off all lockdown</button>
    <p class="note">API pause applies live and does not disable global rules. Reload affected pages
    to apply/release CSP. If removal fails, disable the extension in about:addons.</p>
    <p id="action-error" role="alert"></p>
  </section>
  <div class="foot"><a href="#" id="opts">Settings…</a></div>

  <script src="lockdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
